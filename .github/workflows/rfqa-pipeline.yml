name: RFQA Test Pipeline

on:
  workflow_dispatch:
    inputs:
      owner:
        description: "Repo owner"
        required: true
        type: string
      repo:
        description: "Repo name"
        required: true
        type: string
      issue_number:
        description: "Issue number (must already be labeled RFQA / Ready for QA)"
        required: true
        type: string

jobs:
  run-pipeline:
    name: Run Autonomous QA
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      GITHUB_OWNER: ${{ github.event.inputs.owner }}
      GITHUB_REPO: ${{ github.event.inputs.repo }}
      ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run gitReaderAgent -> testPlannerAgent -> testGeneratorAgent
        run: |
          claude -p "Run gitReaderAgent for ${GITHUB_OWNER}/${GITHUB_REPO}#${ISSUE_NUMBER} to write plan.md, then run testPlannerAgent to write SCENARIOS.md from plan.md, then run testGeneratorAgent to generate and run the Playwright tests from SCENARIOS.md. Finally, post a short PASS/FAIL summary as a comment on the issue." \
            --permission-mode acceptEdits

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 14
