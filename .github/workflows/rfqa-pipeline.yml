name: RFQA Test Pipeline

on:
  workflow_dispatch:
    inputs:
      owner:
        description: "Repo owner"
        required: true
        type: string
      repo:
        description: "Acceptance criteria repo name"
        required: true
        type: string
      issue_number:
        description: "Issue number (must already be labeled RFQA / Ready for QA)"
        required: true
        type: string

  repository_dispatch:
    types: [rfqa-ready]

jobs:
  run-pipeline:
    name: Run Autonomous QA
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      GITHUB_OWNER: ${{ inputs.owner || github.event.client_payload.owner }}
      GITHUB_REPO: ${{ inputs.repo || github.event.client_payload.repo }}
      ISSUE_NUMBER: ${{ inputs.issue_number || github.event.client_payload.issue_number }}
      GITHUB_ISSUE_NUMBER: ${{ inputs.issue_number || github.event.client_payload.issue_number }}
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}

    steps:
      - name: Checkout automation repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Read RFQA issue into plan.md
        run: npm run agent:read

      - name: Generate test scenarios (SCENARIOS.md)
        run: npm run agent:plan

      - name: Generate and run Playwright tests
        run: npm run agent:generate

      - name: Run live executionAgent (Stage 4)
        if: always()
        run: npm run agent:execute
        
      - name: Run full test suite and build reports
        if: always()
        run: npm test

      - name: Post result comment on GitHub issue
        if: always()
        run: node scripts/postComment.mjs

      # - name: Upload Playwright report
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: playwright-report
      #     path: playwright-report/
      #     if-no-files-found: ignore
      #     retention-days: 14

      # - name: Upload Allure results
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: allure-results
      #     path: allure-results/
      #     if-no-files-found: ignore
      #     retention-days: 14

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: evidence/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload generated QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-qa-output
          path: |
            plan.md
            SCENARIOS.md
            tests/
          if-no-files-found: ignore
          retention-days: 14